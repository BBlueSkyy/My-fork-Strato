name: Zelda LA baseline APK (28bcb957)

# A one-off historical build for FPS regression comparison.
# This workflow builds the pinned pre-Marvel source, not the branch's master tree.
on:
  push:
    branches:
      - build/zelda-la-baseline-28bcb957

permissions:
  contents: read

concurrency:
  group: zelda-la-baseline-28bcb957
  cancel-in-progress: true

jobs:
  android-arm64-reldebug:
    name: Build historical ARM64 DevReldebug
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact pre-Marvel Strato commit
        uses: actions/checkout@v4
        with:
          ref: 28bcb957a9f018212f3b0a2e5628028bdb22bf69
          submodules: recursive
          persist-credentials: false

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore CCache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 3Gi

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          ln -s /usr/bin/ninja ./ninja

      - name: Assemble ARM64 DevReldebug (no extra test suites)
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: ./gradlew --no-daemon --stacktrace --parallel --configure-on-demand --build-cache assembleDevReldebug

      - name: Upload historical Zelda baseline APK
        uses: actions/upload-artifact@v4
        with:
          name: strato-zelda-baseline-28bcb957-arm64-devreldebug
          path: app/build/outputs/apk/dev/reldebug/app-dev-reldebug.apk
          if-no-files-found: error
          retention-days: 14
