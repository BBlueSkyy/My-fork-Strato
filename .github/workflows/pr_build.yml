# Experimental laboratory only. Do not merge this workflow into master.
name: PR341 mip A-B laboratory

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ master ]

concurrency:
  group: pr341-ab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: A-B-C ARM64 Release (one signing key)
    runs-on: ubuntu-latest
    steps:
      - name: Configure parallel submodule checkout
        run: git config --global submodule.fetchJobs 8
      - name: Checkout pinned laboratory branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Verify pinned baseline history
        run: git cat-file -e '505bc7d1a572f415032c908989a236c48b1ba533^{commit}'
      - name: Restore CCache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 3Gi
      - name: Restore Gradle Cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Ninja
        run: |
          sudo apt-get install -y ninja-build
          ln -s /usr/bin/ninja .
      - name: Check experimental axes and unchanged baseline regressions
        run: |
          python3 experiments/pr341/test.py
          python3 tests/gpu_null_storage_image/run.py
          python3 tests/gpu_sampled_layout/run.py
      - name: Build A, B and C incrementally with the same certificate
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_COMPILERCHECK: "string:${{ env.NDK_VERSION }}"
          PR_NUMBER: ${{ github.event.number }}
        run: python3 experiments/pr341/build_all.py
      - name: Upload successful APKs, exact diffs and manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: strato-pr${{ github.event.number }}-pr341-AB-arm64-release
          path: pr341-artifacts/
