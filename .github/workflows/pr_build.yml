# A workflow to build and upload APKs for pull requests
name: PR Build

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ master, UE4-fixes, fix/scheduler-yield-progress, fix/mk11-shader-android ]

# Only allow the latest build to run for a given PR, and cancel any previous builds
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
    
      - name: Debug NDK
        if: ${{ !(startsWith(github.head_ref, 'debug/') || github.head_ref == 'fix/scheduler-yield-progress' || github.head_ref == 'fix/mk11-shader-android' || github.head_ref == 'fix/mk11-vulkan-validation') }}
        run: |
          echo "== NDKs instalados =="
          ls -la $ANDROID_SDK_ROOT/ndk || true
          echo "== Variaveis de ambiente =="
          env | grep -i ndk || true
     
      - name: Restore CCache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 3Gi

      

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin' # Temurin should come pre-installed on GitHub-hosted runners
          java-version: '17'
          cache: gradle

      - name: Install Ninja Build
        run: |
          sudo apt-get install -y ninja-build
          ln -s /usr/bin/ninja .

      # Diagnostic PRs deliver a targeted APK first; standard PRs retain every host gate.
      - name: Texman view-range regression (UBSan)
        if: ${{ !(startsWith(github.head_ref, 'debug/') || github.head_ref == 'fix/scheduler-yield-progress' || github.head_ref == 'fix/mk11-shader-android' || github.head_ref == 'fix/mk11-vulkan-validation') }}
        run: |
          c++ -std=c++20 -Wall -Wextra -Werror \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -Iapp/src/main/cpp/skyline \
            -Iapp/libraries/vkhpp \
            -Iapp/libraries/vkhpp/Vulkan-Headers/include \
            tests/gpu/texture_view_range_tests.cpp -o /tmp/texman-view-range-tests
          /tmp/texman-view-range-tests

      - name: Occlusion and conditional rendering regressions
        if: ${{ !(startsWith(github.head_ref, 'debug/') || github.head_ref == 'fix/scheduler-yield-progress' || github.head_ref == 'fix/mk11-shader-android' || github.head_ref == 'fix/mk11-vulkan-validation') }}
        run: |
          python3 tests/gpu_queries/run.py
          python3 tests/gpu_conditional/run.py
          python3 tests/gpu_draw_texture/run.py

      - name: Texture layout and submission regressions
        if: ${{ !(startsWith(github.head_ref, 'debug/') || github.head_ref == 'fix/scheduler-yield-progress' || github.head_ref == 'fix/mk11-shader-android' || github.head_ref == 'fix/mk11-vulkan-validation') }}
        run: |
          python3 tests/gpu_sampled_layout/run.py
          python3 tests/gpu_submission/run.py

      - name: Scheduler regressions (UBSan)
        run: python3 tests/kernel_scheduler/run.py

      - name: Vulkan feature and sampler regressions
        run: |
          python3 tests/gpu_shader_features/run.py
          python3 tests/gpu_samplers/run.py

      - name: Install shader validation tools
        if: ${{ github.head_ref == 'fix/mk11-shader-android' || github.head_ref == 'fix/mk11-vulkan-validation' }}
        run: sudo apt-get install -y spirv-tools libboost-dev clang libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers

      - name: Vulkan descriptor and image regressions
        if: ${{ github.head_ref == 'fix/mk11-vulkan-validation' }}
        env:
          SHADER_COMPILER_ROOT: ${{ github.workspace }}/app/libraries/shader-compiler
          BOOST_INCLUDE_DIR: /usr/include
          BOOST_INCLUDE: /usr/include
          HOST_DEPS: ${{ github.workspace }}/app/libraries
        run: |
          python3 tests/gpu_bindless/run.py
          python3 tests/gpu_pipeline_variants/run.py
          python3 tests/gpu_dynamic_features/run.py
          python3 tests/gpu_dynamic_descriptors/run.py
          python3 tests/gpu_dynamic_integration/run.py
          python3 tests/gpu_compact_descriptors/run.py
          python3 tests/gpu_image_views/run.py
          python3 tests/gpu_texture_components/run.py
          python3 tests/gpu_attachment_feedback/run.py
          python3 tests/gpu_conditional/run.py
          python3 tests/gpu_draw_texture/run.py
          python3 tests/gpu_submission/run.py
          python3 tests/gpu_sampled_layout/run.py

      - name: Shader compiler SPIR-V regressions
        if: ${{ github.head_ref == 'fix/mk11-shader-android' || github.head_ref == 'fix/mk11-vulkan-validation' }}
        env:
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
          XDG_RUNTIME_DIR: /tmp
        run: |
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          cmake -S app/libraries/shader-compiler/tests/storage_subword -B build/shader-host -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DHOST_DEPS="${PWD}/app/libraries" -DBOOST_INCLUDE_DIR=/usr/include
          cmake --build build/shader-host --parallel 2
          ctest --test-dir build/shader-host --output-on-failure

      - name: Android Assemble
        env:
          CMAKE_C_COMPILER_LAUNCHER: "ccache"
          CMAKE_CXX_COMPILER_LAUNCHER: "ccache"
          CCACHE_COMPILERCHECK: "string:android-ndk-27.3.13750724" # Matches app/build.gradle; stable across PR updates
          PR_NUMBER: ${{ github.event.number }}
        run: |
          if [[ "${{ (startsWith(github.head_ref, 'debug/') || github.head_ref == 'fix/scheduler-yield-progress' || github.head_ref == 'fix/mk11-shader-android' || github.head_ref == 'fix/mk11-vulkan-validation') }}" == "true" ]]; then
            echo "Targeted validation: compile only the debuggable ARM64 APK"
            ./gradlew --no-daemon --stacktrace --parallel --configure-on-demand --build-cache :app:assembleDevReldebug
          else
            ./gradlew --no-daemon --stacktrace --parallel --configure-on-demand --build-cache assembleDevRelease assembleDevReldebug
          fi

      - name: Rename APKs
        if: ${{ vars.UPLOAD_PR_ARTIFACTS == 'true' || (startsWith(github.head_ref, 'debug/') || github.head_ref == 'fix/scheduler-yield-progress' || github.head_ref == 'fix/mk11-shader-android' || github.head_ref == 'fix/mk11-vulkan-validation') }}
        run: |
          if [[ "${{ (startsWith(github.head_ref, 'debug/') || github.head_ref == 'fix/scheduler-yield-progress' || github.head_ref == 'fix/mk11-shader-android' || github.head_ref == 'fix/mk11-vulkan-validation') }}" != "true" ]]; then
            mv app/build/outputs/apk/dev/release/app-dev-release.apk strato-pr${{ github.event.number }}-release.apk
          fi
          mv app/build/outputs/apk/dev/reldebug/app-dev-reldebug.apk strato-pr${{ github.event.number }}-reldebug.apk

      - name: Upload Release APK
        if: ${{ vars.UPLOAD_PR_ARTIFACTS == 'true' && !(startsWith(github.head_ref, 'debug/') || github.head_ref == 'fix/scheduler-yield-progress' || github.head_ref == 'fix/mk11-shader-android' || github.head_ref == 'fix/mk11-vulkan-validation') }}
        uses: actions/upload-artifact@v4
        with:
          name: strato-pr${{ github.event.number }}-release.apk
          path: strato-pr${{ github.event.number }}-release.apk

      - name: Upload Debug APK
        if: ${{ vars.UPLOAD_PR_ARTIFACTS == 'true' || (startsWith(github.head_ref, 'debug/') || github.head_ref == 'fix/scheduler-yield-progress' || github.head_ref == 'fix/mk11-shader-android' || github.head_ref == 'fix/mk11-vulkan-validation') }}
        uses: actions/upload-artifact@v4
        with:
          name: strato-pr${{ github.event.number }}-reldebug.apk
          path: strato-pr${{ github.event.number }}-reldebug.apk
