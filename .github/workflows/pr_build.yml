# A workflow to build and upload APKs for pull requests
name: PR #426 Clean NCE ARM64

on:
  push:
    branches: [ build/pr426-clean-nce-arm64-20261110 ]

# Only allow the latest build to run for a given PR, and cancel any previous builds
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # checkout uses git submodule update --recursive; parallelize its clones.
      - name: Configure parallel submodule checkout
        run: git config --global submodule.fetchJobs 8

      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          # The source-verification step compares against the clean #426
          # commit, two parents behind this isolated CI-only commit.
          fetch-depth: 3
          submodules: recursive
    
      - name: Restore CCache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 3Gi

      

      - name: Restore Gradle Cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin' # Temurin should come pre-installed on GitHub-hosted runners
          java-version: '17'

      - name: Install Ninja Build
        run: |
          sudo apt-get install -y ninja-build
          ln -s /usr/bin/ninja .

      - name: Verify source matches clean PR 426
        run: |
          git cat-file -e e62b531a21e74cf2a710ca0acccefc32ef79b1f3^{commit}
          git diff --exit-code e62b531a21e74cf2a710ca0acccefc32ef79b1f3 HEAD -- app/src tests
          test -f app/src/main/cpp/skyline/nce/acquire_lock_patch.h
          test ! -e app/src/main/cpp/skyline/common/botw_pixel_probe.h

      - name: Test NCE acquire and wide-line regressions
        run: python3 tests/nce/run.py

      - name: Android Assemble
        env:
          CMAKE_C_COMPILER_LAUNCHER: "ccache"
          CMAKE_CXX_COMPILER_LAUNCHER: "ccache"
          CCACHE_COMPILERCHECK: "string:${{ env.NDK_VERSION }}" # Use NDK version instead of compiler timestamp
          PR_NUMBER: '426'
        run: ./gradlew --no-daemon --stacktrace --parallel --configure-on-demand --build-cache assembleDevRelease
      - name: Rename ARM64 DevRelease APK
        run: mv app/build/outputs/apk/dev/release/app-dev-release.apk strato-pr426-clean-nce-arm64-release.apk

      - name: Verify ARM64 DevRelease APK
        env:
          APK_PATH: strato-pr426-clean-nce-arm64-release.apk
        run: |
          test -s "$APK_PATH"
          python3 - <<'PYAPK'
          import os, struct, zipfile
          with zipfile.ZipFile(os.environ["APK_PATH"]) as apk:
              libraries = [name for name in apk.namelist() if name.startswith("lib/") and name.endswith(".so")]
              assert libraries, "APK has no native libraries"
              assert all(name.split("/")[1] == "arm64-v8a" for name in libraries), libraries
              for name in libraries:
                  header = apk.read(name)[:20]
                  assert header[:6] == b"\x7fELF\x02\x01", name
                  assert struct.unpack_from("<H", header, 18)[0] == 183, name
              print("Verified nonempty DevRelease APK with", len(libraries), "AArch64 ELF libraries")
          PYAPK

      - name: Upload ARM64 DevRelease APK
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: strato-pr426-clean-nce-arm64-release.apk
          path: strato-pr426-clean-nce-arm64-release.apk
