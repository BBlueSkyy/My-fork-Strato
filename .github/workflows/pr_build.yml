# Dedicated *temporary* A/B APK builder for MK8 PR #341 regression testing.
# This workflow is confined to a Draft PR and MUST NOT be merged into master.
# Every job checks out the pinned historical SHA, then injects identical VI capture code.
# Deliberately VI-only: do NOT describe it as full HDR mini-RenderDoc.
name: MK8 PR341 A/B VI Capture

on:
  push:
    branches: [experiment/mk8-pr341-golden-hdr-ab-20261115]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: mk8-pr341-ab-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.variant }} (historical APK + VI readback)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: pre341
            historical_sha: "381d52d359cace0662383adf6622b0f731d12d3d"
          - variant: post341
            historical_sha: "3e8689f6c99c4678f473178bd0aa99f8528a615e"
    steps:
      - name: Configure parallel submodule checkout
        run: git config --global submodule.fetchJobs 8

      - name: Checkout diagnostic script and complete history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false

      - name: Preserve script and checkout exact historical source
        shell: bash
        env:
          EXPECTED_SHA: ${{ matrix.historical_sha }}
        run: |
          set -euo pipefail
          cp tools/mk8_pr341_legacy_vi_capture.py "$RUNNER_TEMP/mk8_pr341_legacy_vi_capture.py"
          sha256sum "$RUNNER_TEMP/mk8_pr341_legacy_vi_capture.py" | tee "$RUNNER_TEMP/capture-script.sha256"
          git cat-file -e "$EXPECTED_SHA^{commit}"
          git checkout --detach "$EXPECTED_SHA"
          git submodule sync --recursive
          git submodule update --init --recursive --jobs 8

      - name: Verify commit identity (reject merge ref)
        shell: bash
        env:
          EXPECTED_SHA: ${{ matrix.historical_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Variant: ${{ matrix.variant }} / commit: $(git rev-parse HEAD)"
          git status --short
          test -z "$(git status --porcelain --untracked-files=no)"
      
      - name: Add identical opt-in VI readbacks to both historic source trees
        shell: bash
        env:
          EXPECTED_SHA: ${{ matrix.historical_sha }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/mk8_pr341_legacy_vi_capture.py"
          git diff --check
          grep -q 'MK8_PR341_VI_CAPTURE' app/src/main/cpp/skyline/gpu/presentation_engine.cpp
          {
            echo "variant=$VARIANT"
            echo "historical_source=$EXPECTED_SHA"
            echo "original_source_tree=$(git rev-parse HEAD^{tree})"
            echo "vi_capture_script_sha256=$(sha256sum "$RUNNER_TEMP/mk8_pr341_legacy_vi_capture.py" | cut -d ' ' -f1)"
            echo "capture=VI_ONLY_NOT_INTERMEDIATE_HDR"
          } > "$RUNNER_TEMP/capture-provenance.txt"
          cat "$RUNNER_TEMP/capture-provenance.txt"

      - name: Restore CCache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 3Gi

      - name: Restore Gradle Cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-mk8-pr341-${{ matrix.variant }}-gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-mk8-pr341-${{ matrix.variant }}-gradle-
            ${{ runner.os }}-gradle-

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Ninja Build
        run: |
          sudo apt-get install -y ninja-build
          ln -s /usr/bin/ninja .

      - name: Android Assemble (historical source + identical opt-in VI capture)
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          PR_NUMBER: ${{ github.event.number }}
        run: ./gradlew --no-daemon --stacktrace --parallel --configure-on-demand --build-cache assembleDevRelease

      - name: Package and verify historical ARM64 APK
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
          EXPECTED_SHA: ${{ matrix.historical_sha }}
        run: |
          set -euo pipefail
          APK_PATH="strato-mk8-${VARIANT}-${EXPECTED_SHA:0:8}-vi-capture-arm64-release.apk"
          cp app/build/outputs/apk/dev/release/app-dev-release.apk "$APK_PATH"
          test -s "$APK_PATH"
          APK_PATH="$APK_PATH" python3 - <<'PYAPK'
          import os, struct, zipfile
          p = os.environ['APK_PATH']
          with zipfile.ZipFile(p) as apk:
              libs = [n for n in apk.namelist() if n.startswith('lib/') and n.endswith('.so')]
              assert libs, 'No native libraries in APK'
              assert all(n.split('/')[1] == 'arm64-v8a' for n in libs), libs
              for n in libs:
                  data = apk.read(n)[:20]
                  assert data[:6] == b'\x7fELF\x02\x01', n
                  assert struct.unpack_from('<H', data, 18)[0] == 183, n
          assert any(b'MK8_PR341_VI_CAPTURE' in apk.read(n) for n in libs), 'Capture marker missing in native APK'
          print('Verified ARM64 + linked VI capture:', p)
          PYAPK
          cp "$RUNNER_TEMP/capture-provenance.txt" "mk8-${VARIANT}-capture-provenance.txt"

      - name: Upload historical APK and VI-capture provenance
        uses: actions/upload-artifact@v4
        with:
          name: strato-mk8-${{ matrix.variant }}-${{ matrix.historical_sha }}-vi-capture-apk
          path: |
            strato-mk8-${{ matrix.variant }}-*-vi-capture-arm64-release.apk
            mk8-${{ matrix.variant }}-capture-provenance.txt
          if-no-files-found: error
          retention-days: 14
