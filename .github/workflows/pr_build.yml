# A workflow to build and upload APKs for pull requests
name: "SSBO Cycle Order — PR #294"

on:
  push:
    branches: [ investigate/pr294-buffer-cycle-order-20261031 ]

# Only allow the latest build to run for a given PR, and cancel any previous builds
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          submodules: recursive

      - name: Debug NDK
        run: |
          echo "== NDKs instalados =="
          ls -la $ANDROID_SDK_ROOT/ndk || true
          echo "== Variaveis de ambiente =="
          env | grep -i ndk || true

      - name: Restore CCache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 3Gi



      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin' # Temurin should come pre-installed on GitHub-hosted runners
          java-version: '17'

      - name: Install Ninja Build
        run: |
          sudo apt-get install -y ninja-build
          ln -s /usr/bin/ninja .

      - name: Verify copying policy and SSBO binding behavior
        run: |
          # The differential test reads this exact baseline, beyond the shallow parent.
          git fetch --no-tags --depth=1 origin b8593d8b2c2e9742a4f1f9edfaa935f653cd3663
          python3 tests/ssbo_trace/run.py
          python3 tests/gpu_megabuffer_rejected/run.py
          python3 tests/gpu_dirty_origins/run.py

      - name: Android Assemble
        env:
          CMAKE_C_COMPILER_LAUNCHER: "ccache"
          CMAKE_CXX_COMPILER_LAUNCHER: "ccache"
          CCACHE_COMPILERCHECK: "string:${{ env.NDK_VERSION }}" # Use NDK version instead of compiler timestamp
          PR_NUMBER: ${{ github.event.number }}
        run: ./gradlew --no-daemon --stacktrace --parallel --configure-on-demand assembleDevRelease
      - name: Verify experimental provenance
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse HEAD^)" = "15c8da813fa86e8fdc786aa2ca7ea6ef6b5595a7"
          test "$(git -C app/libraries/shader-compiler rev-parse HEAD)" = "97a97679a1d48877aec7d31c7871df28be239415"
          test -s app/build/outputs/apk/dev/release/app-dev-release.apk
          unzip -l app/build/outputs/apk/dev/release/app-dev-release.apk | grep 'lib/arm64-v8a/libskyline.so'
          {
            echo "SSBO Cycle Order — PR #294; experimental, not a permanent fix"
            echo "Base: abf26faa164520f1a88370f6a3e185f95b7a0138"
            echo "Host: $(git rev-parse HEAD)"
            echo "Shader compiler: $(git -C app/libraries/shader-compiler rev-parse HEAD)"
            echo "Variant: assembleDevRelease; arm64-v8a"
            sha256sum app/build/outputs/apk/dev/release/app-dev-release.apk
          } > SSBO-Cycle-Order-PR294-provenance.txt
      - name: Rename ARM64 DevRelease APK
        run: mv app/build/outputs/apk/dev/release/app-dev-release.apk Strato-SSBO-Cycle-Order-PR294-arm64-devrelease.apk
      - name: Upload Teste SSBO PR294
        uses: actions/upload-artifact@v4
        with:
          name: Strato-SSBO-Cycle-Order-PR294-ARM64-DevRelease
          if-no-files-found: error
          path: |
            Strato-SSBO-Cycle-Order-PR294-arm64-devrelease.apk
            SSBO-Cycle-Order-PR294-provenance.txt
