name: SSBO Range A-B — PR294
on:
  push:
    branches: [ investigate/pr294-ssbo-range-ab-20261031 ]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: A
            policy: '0'
          - arm: B
            policy: '1'
    env:
      STRATO_SSBO_RANGE_AB: ${{ matrix.policy }}
    steps:
      - name: Checkout identical experiment source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          submodules: recursive
      - name: Verify experiment ancestry and modern compiler
        run: |
          test "$(git rev-parse HEAD^)" = c7cb28d822c52437ed83e9f86ed15c3a3b77c6e7
          test "$(git -C app/libraries/shader-compiler rev-parse HEAD)" = dcb938866f4234963fcbc199f2443438d8ef6f07
          python3 tests/ssbo_range_ab/run.py
      - name: Restore CCache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 3Gi
          key: ssbo-range-${{ matrix.arm }}
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Ninja
        run: |
          sudo apt-get install -y ninja-build
          ln -s /usr/bin/ninja .
      - name: ARM64 DevRelease only
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_COMPILERCHECK: content
        run: ./gradlew --no-daemon --stacktrace --parallel --configure-on-demand assembleDevRelease
      - name: Verify and identify APK
        env:
          ARM: ${{ matrix.arm }}
        run: |
          test -s app/build/outputs/apk/dev/release/app-dev-release.apk
          unzip -l app/build/outputs/apk/dev/release/app-dev-release.apk | grep 'lib/arm64-v8a/libskyline.so'
          test -z "$(git status --porcelain --untracked-files=no)"
          mv app/build/outputs/apk/dev/release/app-dev-release.apk "Strato-SSBO-Range-${ARM}-ARM64-DevRelease.apk"
          {
            echo "SSBO range controlled experiment — PR294; NOT A PERMANENT FIX"
            echo "Arm: ${ARM}; STRATO_SSBO_RANGE_AB=${STRATO_SSBO_RANGE_AB}"
            echo "Source: $(git rev-parse HEAD); historical BAD base: c7cb28d"
            echo "Compiler: $(git -C app/libraries/shader-compiler rev-parse HEAD)"
            echo "Build: assembleDevRelease; arm64-v8a"
            sha256sum "Strato-SSBO-Range-${ARM}-ARM64-DevRelease.apk"
          } > "SSBO-Range-${ARM}-provenance.txt"
      - name: Upload experiment arm
        uses: actions/upload-artifact@v4
        with:
          name: Strato-SSBO-Range-${{ matrix.arm }}-ARM64-DevRelease
          if-no-files-found: error
          path: |
            Strato-SSBO-Range-${{ matrix.arm }}-ARM64-DevRelease.apk
            SSBO-Range-${{ matrix.arm }}-provenance.txt
