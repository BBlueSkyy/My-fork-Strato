# A workflow to build and upload APKs for pull requests
name: "Teste SSBO — PR #294"

on:
  push:
    branches: [ investigate/pr294-ssbo-restore-20261031 ]

# Only allow the latest build to run for a given PR, and cancel any previous builds
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          submodules: recursive
    
      - name: Debug NDK
        run: |
          echo "== NDKs instalados =="
          ls -la $ANDROID_SDK_ROOT/ndk || true
          echo "== Variaveis de ambiente =="
          env | grep -i ndk || true
     
      - name: Restore CCache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 3Gi

      

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin' # Temurin should come pre-installed on GitHub-hosted runners
          java-version: '17'

      - name: Install Ninja Build
        run: |
          sudo apt-get install -y ninja-build
          ln -s /usr/bin/ninja .

      - name: Android Assemble
        env:
          CMAKE_C_COMPILER_LAUNCHER: "ccache"
          CMAKE_CXX_COMPILER_LAUNCHER: "ccache"
          CCACHE_COMPILERCHECK: "string:${{ env.NDK_VERSION }}" # Use NDK version instead of compiler timestamp
          PR_NUMBER: ${{ github.event.number }}
        run: ./gradlew --no-daemon --stacktrace --parallel --configure-on-demand assembleDevRelease
      - name: Verify experimental provenance
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "$(git rev-parse HEAD^)" = "c7cb28d822c52437ed83e9f86ed15c3a3b77c6e7"
          test "$(git -C app/libraries/shader-compiler rev-parse HEAD)" = "6c804797a6e073c925958cedd6d5eb8114a3c65d"
          {
            echo "Teste SSBO — PR #294; experimental, not a permanent fix"
            echo "Base: c7cb28d822c52437ed83e9f86ed15c3a3b77c6e7"
            echo "Host: $(git rev-parse HEAD)"
            echo "Shader compiler: $(git -C app/libraries/shader-compiler rev-parse HEAD)"
            echo "Variant: assembleDevRelease; arm64-v8a"
            sha256sum app/build/outputs/apk/dev/release/app-dev-release.apk
          } > Teste-SSBO-PR294-provenance.txt
      - name: Rename ARM64 DevRelease APK
        run: mv app/build/outputs/apk/dev/release/app-dev-release.apk Strato-Teste-SSBO-PR294-arm64-devrelease.apk
      - name: Upload Teste SSBO PR294
        uses: actions/upload-artifact@v4
        with:
          name: Strato-Teste-SSBO-PR294-ARM64-DevRelease
          if-no-files-found: error
          path: |
            Strato-Teste-SSBO-PR294-arm64-devrelease.apk
            Teste-SSBO-PR294-provenance.txt
