# Dedicated *temporary* A/B APK builder for MK8 PR #385 regression testing.
# This workflow is confined to a Draft PR and MUST NOT be merged into master.
# Every job checks out the pinned historical SHA, not the PR merge ref.
name: MK8 PR385 A/B Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: mk8-pr385-ab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.variant }} (historical Android APK)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: pre385
            historical_sha: "12cbaa17f3e1fac4f109ba9d272ea29eb573f667"
          - variant: post385
            historical_sha: "68f4f3ab5f3ad33a9cfdc1c521190f3df88ec295"
    steps:
      - name: Configure parallel submodule checkout
        run: git config --global submodule.fetchJobs 8

      - name: Checkout exactly the historical tree and submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.historical_sha }}
          submodules: recursive
          persist-credentials: false

      - name: Verify commit identity (reject merge ref)
        shell: bash
        env:
          EXPECTED_SHA: ${{ matrix.historical_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          echo "Variant: ${{ matrix.variant }} / commit: $(git rev-parse HEAD)"
          git status --short

      - name: Restore CCache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 3Gi

      - name: Restore Gradle Cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-mk8-pr385-${{ matrix.variant }}-gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-mk8-pr385-${{ matrix.variant }}-gradle-
            ${{ runner.os }}-gradle-

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Ninja Build
        run: |
          sudo apt-get install -y ninja-build
          ln -s /usr/bin/ninja .

      - name: Android Assemble (unaltered historical source)
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          PR_NUMBER: ${{ github.event.number }}
        run: ./gradlew --no-daemon --stacktrace --parallel --configure-on-demand --build-cache assembleDevRelease

      - name: Package and verify historical ARM64 APK
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
          EXPECTED_SHA: ${{ matrix.historical_sha }}
        run: |
          set -euo pipefail
          APK_PATH="strato-mk8-${VARIANT}-${EXPECTED_SHA:0:8}-arm64-release.apk"
          cp app/build/outputs/apk/dev/release/app-dev-release.apk "$APK_PATH"
          test -s "$APK_PATH"
          APK_PATH="$APK_PATH" python3 - <<'PYAPK'
          import os, struct, zipfile
          p = os.environ['APK_PATH']
          with zipfile.ZipFile(p) as apk:
              libs = [n for n in apk.namelist() if n.startswith('lib/') and n.endswith('.so')]
              assert libs, 'No native libraries in APK'
              assert all(n.split('/')[1] == 'arm64-v8a' for n in libs), libs
              for n in libs:
                  data = apk.read(n)[:20]
                  assert data[:6] == b'\x7fELF\x02\x01', n
                  assert struct.unpack_from('<H', data, 18)[0] == 183, n
          print('Verified:', p)
          PYAPK

      - name: Upload historical APK
        uses: actions/upload-artifact@v4
        with:
          name: strato-mk8-${{ matrix.variant }}-${{ matrix.historical_sha }}-apk
          path: strato-mk8-${{ matrix.variant }}-*-arm64-release.apk
          if-no-files-found: error
          retention-days: 14
