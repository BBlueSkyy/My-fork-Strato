# A workflow to build and upload APKs for pull requests
name: PR Build

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
    branches: [ master, UE4-fixes ]

# Only allow the latest build to run for a given PR, and cancel any previous builds
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
    
      - name: Debug NDK
        run: |
          echo "== NDKs instalados =="
          ls -la $ANDROID_SDK_ROOT/ndk || true
          echo "== Variaveis de ambiente =="
          env | grep -i ndk || true
     
      - name: Restore CCache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 3Gi

      

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin' # Temurin should come pre-installed on GitHub-hosted runners
          java-version: '17'

      - name: Install Ninja Build
        run: |
          sudo apt-get install -y ninja-build
          ln -s /usr/bin/ninja .

      - name: Texman view-range regression (UBSan)
        if: ${{ github.head_ref != 'diagnostic/unmapped-texture-pool' }}
        run: |
          c++ -std=c++20 -Wall -Wextra -Werror \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -Iapp/src/main/cpp/skyline \
            -Iapp/libraries/vkhpp \
            -Iapp/libraries/vkhpp/Vulkan-Headers/include \
            tests/gpu/texture_view_range_tests.cpp -o /tmp/texman-view-range-tests
          /tmp/texman-view-range-tests

      - name: Occlusion and conditional rendering regressions
        if: ${{ github.head_ref != 'diagnostic/unmapped-texture-pool' }}
        run: |
          python3 tests/gpu_queries/run.py
          python3 tests/gpu_conditional/run.py
          python3 tests/gpu_draw_texture/run.py

      - name: Texture layout and submission regressions
        if: ${{ github.head_ref != 'diagnostic/unmapped-texture-pool' }}
        run: |
          python3 tests/gpu_sampled_layout/run.py
          python3 tests/gpu_submission/run.py

      - name: Android Assemble
        env:
          CMAKE_C_COMPILER_LAUNCHER: "ccache"
          CMAKE_CXX_COMPILER_LAUNCHER: "ccache"
          CCACHE_COMPILERCHECK: "string:${{ env.NDK_VERSION }}" # Use NDK version instead of compiler timestamp
          PR_NUMBER: ${{ github.event.number }}
        run: |
          if [[ "$GITHUB_HEAD_REF" == "diagnostic/unmapped-texture-pool" ]]; then
            ./gradlew --no-daemon --stacktrace --parallel --configure-on-demand --build-cache assembleDevRelease
          else
            ./gradlew --no-daemon --stacktrace --parallel --configure-on-demand --build-cache assembleDevRelease assembleDevReldebug
          fi
      - name: Rename APKs
        if: ${{ vars.UPLOAD_PR_ARTIFACTS == 'true' }}
        run: |
          mv app/build/outputs/apk/dev/release/app-dev-release.apk strato-pr${{ github.event.number }}-release.apk
          if [[ "$GITHUB_HEAD_REF" != "diagnostic/unmapped-texture-pool" ]]; then
            mv app/build/outputs/apk/dev/reldebug/app-dev-reldebug.apk strato-pr${{ github.event.number }}-reldebug.apk
          fi

      - name: Upload Release APK
        if: ${{ vars.UPLOAD_PR_ARTIFACTS == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: strato-pr${{ github.event.number }}-release.apk
          path: strato-pr${{ github.event.number }}-release.apk

      - name: Upload Debug APK
        if: ${{ vars.UPLOAD_PR_ARTIFACTS == 'true' && github.head_ref != 'diagnostic/unmapped-texture-pool' }}
        uses: actions/upload-artifact@v4
        with:
          name: strato-pr${{ github.event.number }}-reldebug.apk
          path: strato-pr${{ github.event.number }}-reldebug.apk
