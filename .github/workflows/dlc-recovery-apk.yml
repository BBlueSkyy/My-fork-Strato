# Temporary APK build for DLC rejection testing. Does not change PR Build gates.
name: DLC recovery ARM64 APK

on:
  push:
    branches:
      - fix/dlc-startup-rejection-20261108

jobs:
  diagnostic-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Configure parallel submodule checkout
        run: git config --global submodule.fetchJobs 8
      - name: Checkout sources and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Build DevRelease APK
        run: ./gradlew --no-daemon --stacktrace --parallel --configure-on-demand --build-cache assembleDevRelease
      - name: Verify native ABI
        run: |
          python3 - <<'PYAPK'
          import os, struct, zipfile
          path = 'app/build/outputs/apk/dev/release/app-dev-release.apk'
          assert os.path.getsize(path) > 0
          with zipfile.ZipFile(path) as apk:
              libs = [name for name in apk.namelist() if name.startswith('lib/') and name.endswith('.so')]
              assert libs and all(name.split('/')[1] == 'arm64-v8a' for name in libs)
              for name in libs:
                  h = apk.read(name)[:20]
                  assert h[:6] == b'\x7fELF\x02\x01'
                  assert struct.unpack_from('<H', h, 18)[0] == 183
          PYAPK
      - name: Upload APK for device validation
        uses: actions/upload-artifact@v4
        with:
          name: strato-dlc-recovery-arm64
          path: app/build/outputs/apk/dev/release/app-dev-release.apk
          if-no-files-found: error
