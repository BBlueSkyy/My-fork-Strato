name: Depth Stencil Tests
on:
  pull_request:
    branches: [master]
    paths:
      - 'app/src/main/cpp/skyline/gpu/**'
      - 'tests/gpu_depth_stencil*/**'
      - '.github/workflows/depth_stencil_tests.yml'
jobs:
  depth-stencil:
    runs-on: ubuntu-latest
    env:
      VULKAN_HPP_INCLUDE_DIR: /usr/include
      VULKAN_HEADERS_INCLUDE_DIR: /usr/include
      XDG_RUNTIME_DIR: /tmp
    steps:
      - uses: actions/checkout@v4
      - name: Install host Vulkan test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ libboost-dev libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers glslang-tools spirv-tools
      - name: CPU serialization and clear regressions
        run: |
          python3 tests/gpu_depth_stencil/run.py
          python3 tests/gpu_depth_stencil_guest/run.py
          python3 tests/gpu_depth_stencil_clear/run.py
      - name: Vulkan 1.1 depth and stencil data tests
        run: |
          depth_icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$depth_icd"
          export VK_ICD_FILENAMES="$depth_icd"
          python3 tests/gpu_depth_stencil_vulkan/run.py
          python3 tests/gpu_depth_stencil_alias/run.py
