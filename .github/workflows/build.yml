name: Build LLDB

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore CCache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 3Gi

      - name: Restore Gradle Cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle') }}-${{ hashFiles('app/**/*.xml') }}-${{ hashFiles('app/**.kt', 'app/**.java') }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle') }}-${{ hashFiles('app/**/*.xml') }}-
            ${{ runner.os }}-gradle-${{ hashFiles('**/build.gradle') }}-
            ${{ runner.os }}-gradle-

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Ninja Build
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          ln -s /usr/bin/ninja .

      - name: Build DevReldDebug
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_COMPILERCHECK: string:${{ env.NDK_VERSION }}
        run: ./gradlew --no-daemon --stacktrace --build-cache --parallel --configure-on-demand assembleDevReldDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Strato-DevReldDebug-APK
          path: app/build/outputs/apk/dev/reldebug/*.apk

      - name: Upload native build files
        uses: actions/upload-artifact@v4
        with:
          name: Strato-DevReldDebug-Native
          path: |
            app/build/intermediates/cxx/**
            app/build/intermediates/merged_native_libs/**
            app/build/intermediates/stripped_native_libs/**
          if-no-files-found: warn
