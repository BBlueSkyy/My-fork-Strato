name: NCE context tests
on:
  pull_request:
    paths:
      - 'app/src/main/cpp/skyline/nce/guest.*'
      - 'tests/nce/**'
      - '.github/workflows/nce_tests.yml'
jobs:
  context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install unicorn==2.1.4 keystone-engine==0.9.2
      - run: bash tests/nce/run.sh
