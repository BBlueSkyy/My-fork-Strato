name: Kirby TIC Probe ARM64

# Isolated diagnostic build; the parent #454 PR intentionally retains its
# failing cache-specialization gate. Never claim this APK fixes that gate.
on:
  push:
    branches:
      - debug/kirby-tic-probe-pr454-20261113
  workflow_dispatch:

concurrency:
  group: kirby-tic-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Configure parallel submodule checkout
        run: git config --global submodule.fetchJobs 8
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Restore CCache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 3Gi
      - name: Restore Gradle Cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          ln -s /usr/bin/ninja .
      - name: TIC diagnostics and baseline texture regressions
        run: |
          python3 tests/gpu_tic_probe/run.py
          python3 tests/gpu_null_storage_image/run.py
          python3 tests/gpu_tic_validation/run.py
      - name: Build ARM64 DevRelease diagnostic APK
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: ./gradlew --no-daemon --stacktrace --parallel --configure-on-demand --build-cache assembleDevRelease
      - name: Verify diagnostic APK and architecture
        run: |
          test -s app/build/outputs/apk/dev/release/app-dev-release.apk
          python3 - <<'PYAPK'
          import pathlib, struct, zipfile
          apk_path = pathlib.Path('app/build/outputs/apk/dev/release/app-dev-release.apk')
          with zipfile.ZipFile(apk_path) as apk:
              libs = [p for p in apk.namelist() if p.startswith('lib/') and p.endswith('.so')]
              assert libs, 'missing native libraries'
              for path in libs:
                  elf = apk.read(path)[:20]
                  assert path.startswith('lib/arm64-v8a/'), path
                  assert elf[:6] == b'\x7fELF\x02\x01', path
                  assert struct.unpack_from('<H', elf, 18)[0] == 183, path
          PYAPK
          cp app/build/outputs/apk/dev/release/app-dev-release.apk strato-kirby-tic-probe-arm64-release.apk
      - name: Upload ARM64 diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: strato-kirby-tic-probe-arm64-release.apk
          path: strato-kirby-tic-probe-arm64-release.apk
