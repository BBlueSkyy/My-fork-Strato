name: PR 294 APK (isolated)
on:
  push:
    branches:
      - build/pr294-apk-fix

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Restore CCache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 3Gi
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Ninja Build
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Android Assemble
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
        run: ./gradlew --no-daemon --parallel --configure-on-demand assembleDevRelease assembleDevReldebug
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: strato-pr294-release.apk
          path: app/build/outputs/apk/dev/release/app-dev-release.apk
      - name: Upload RelDebug APK
        uses: actions/upload-artifact@v4
        with:
          name: strato-pr294-reldebug.apk
          path: app/build/outputs/apk/dev/reldebug/app-dev-reldebug.apk
