name: Stage C Guest Bridge (experimental)

on:
  # Run the isolated Vulkan test for every Stage C experiment commit even
  # when pull-request events or the default branch's workflow state skip it.
  push:
    branches: [experiment/mixed-region-authority-on-20261105]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [master]
  workflow_dispatch:

jobs:
  guest-bridge:
    # This workflow validates the isolated stage-C feature. It never enables
    # production gate flags or publishes a runnable APK with this feature.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 424
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout with Vulkan and shader-compiler submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install minimal Vulkan host test prerequisites
        run: |
          command -v clang++
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libvulkan-dev vulkan-validationlayers mesa-vulkan-drivers libboost-dev
      - name: Verify byte coverage and transactional writer ledger (ASan/UBSan)
        env:
          SANITIZE: address,undefined
          ASAN_OPTIONS: detect_leaks=0
        run: python3 tests/gpu_guest_bridge_coverage/run.py
      - name: Real Vulkan buffer/image guest-bridge oracle (ASan/UBSan)
        env:
          CXX: clang++
          CXXFLAGS: "-Wno-reorder-init-list -Wno-deprecated-copy -Wno-defaulted-function-deleted -Wno-deprecated-declarations"
          SANITIZE: address,undefined
          ASAN_OPTIONS: detect_leaks=0
          LP_NUM_THREADS: 2
          TEXMAN_MIXED_GUEST_BRIDGE_TEST: 1
        run: python3 tests/gpu_buffer_image_sequence/run.py --automatic
