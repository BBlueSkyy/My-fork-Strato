name: PR294 Zelda Shader Capture
on:
  push:
    branches:
      - investigate/pr294-zelda-shader-capture-20261031
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          submodules: recursive
      - name: Restore CCache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 3Gi
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Ninja Build
        run: |
          sudo apt-get install -y ninja-build
          ln -s /usr/bin/ninja .
      - name: Source and compiler pin check
        run: |
          test "$(git rev-parse HEAD^)" = "c7cb28d822c52437ed83e9f86ed15c3a3b77c6e7"
          test "$(git -C app/libraries/shader-compiler rev-parse HEAD)" = "dcb938866f4234963fcbc199f2443438d8ef6f07"
          grep -q 'ZeldaShaderCaptureBegin' app/src/main/cpp/skyline/gpu/shader_manager.cpp
      - name: Android Assemble
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_COMPILERCHECK: string:${{ env.NDK_VERSION }}
        run: ./gradlew --no-daemon --stacktrace --parallel --configure-on-demand assembleDevRelease
      - name: Verify APK and provenance
        run: |
          test -s app/build/outputs/apk/dev/release/app-dev-release.apk
          unzip -l app/build/outputs/apk/dev/release/app-dev-release.apk | grep 'lib/arm64-v8a/libskyline.so'
          {
            echo "PR294 Zelda Shader Capture"
            echo "Baseline: c7cb28d822c52437ed83e9f86ed15c3a3b77c6e7"
            echo "Compiler: dcb938866f4234963fcbc199f2443438d8ef6f07"
            echo "Instrumented: $(git rev-parse HEAD)"
            echo "Target: Zelda Compute shader 0xE8B459126941F6CE; payloads Maxwell/SPIRV and CBUF reads; not a performance test"
            echo "No waits beyond existing slot completion; CPU totals not additive to GPU timing"
            sha256sum app/build/outputs/apk/dev/release/app-dev-release.apk
          } > pr294-zelda-shader-capture-provenance.txt
          mv app/build/outputs/apk/dev/release/app-dev-release.apk Strato-PR294-ZeldaShaderCapture-ARM64-DevRelease.apk
      - name: Upload shader capture
        uses: actions/upload-artifact@v4
        with:
          name: Strato-PR294-ZeldaShaderCapture-ARM64-DevRelease
          if-no-files-found: error
          path: |
            Strato-PR294-ZeldaShaderCapture-ARM64-DevRelease.apk
            pr294-zelda-shader-capture-provenance.txt
