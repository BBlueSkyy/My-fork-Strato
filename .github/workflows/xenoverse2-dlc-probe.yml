# Temporary, diagnostic-only APK build for Xenoverse 2 DLC investigation.
# This does not change the repository's standard PR Build checks.
name: Xenoverse 2 DLC probe APK

on:
  push:
    branches:
      - diag/xenoverse2-dlc-romfs-20261107

jobs:
  diagnostic-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Configure parallel submodule checkout
        run: git config --global submodule.fetchJobs 8

      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Compile ARM64 DevRelease diagnostic APK
        run: ./gradlew --no-daemon --stacktrace --parallel --configure-on-demand --build-cache assembleDevRelease

      - name: Verify APK contains AArch64 libraries
        run: |
          python3 - <<'PYAPK'
          import os, struct, zipfile
          path = 'app/build/outputs/apk/dev/release/app-dev-release.apk'
          assert os.path.getsize(path) > 0, 'APK is empty'
          with zipfile.ZipFile(path) as apk:
              libraries = [name for name in apk.namelist() if name.startswith('lib/') and name.endswith('.so')]
              assert libraries, 'No native libraries'
              assert all(name.split('/')[1] == 'arm64-v8a' for name in libraries), libraries
              assert all(apk.read(name)[:6] == b'\x7fELF\x02\x01' and
                         struct.unpack_from('<H', apk.read(name), 18)[0] == 183
                         for name in libraries), 'Non-AArch64 native library'
          PYAPK

      - name: Upload diagnostic APK
        uses: actions/upload-artifact@v4
        with:
          name: xenoverse2-dlc-romfs-probe-arm64
          path: app/build/outputs/apk/dev/release/app-dev-release.apk
          if-no-files-found: error
